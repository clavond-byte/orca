name: DEV-only Orca observer Linux artifact

on:
  push:
    branches:
      - codex/observer-dev-linux-build-20261021
    paths:
      - .github/workflows/observer-dev-linux-build.yml

permissions:
  contents: read

concurrency:
  group: observer-dev-linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 88c5e868f738cea69633483a03e0096257f6effb
          persist-credentials: false
      - name: Check exact observer source and target
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = 88c5e868f738cea69633483a03e0096257f6effb
          test "$(git rev-parse 'HEAD^{tree}')" = 8c39c7563786e021762f7a8335478e6673afb431
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(node config/scripts/build-orcad-prebuilds.mjs --print-slot)" = linux-x64-glibc
          node --version
      - uses: ./.github/actions/install-node-dependencies
        with:
          node-version: '24'
          native-runtime: none
          cache-pnpm-store: 'false'
          cache-pnpm-verification: 'false'
          persist-native-cache: 'false'
      - uses: ./.github/actions/build-mobile-web-bundle
      - name: Build pinned Linux x64 prebuild
        run: |
          pnpm build:orcad-prebuilds
          pnpm build:orcad-prebuilds --require-slots "$(node config/scripts/build-orcad-prebuilds.mjs --print-slot)"
          pnpm build:orcad-prebuilds --smoke
      - name: Build DEV-only server package
        run: pnpm build:orcad
      - name: Build Linux package test template
        run: node config/scripts/build-orcad-template.mjs --targets linux-x64-glibc
      - name: Smoke packaged server
        run: |
          test -s out/orcad/orcad.js
          test -d out/runtimes
          node out/orcad/orcad.js --orcad-smoke-load-check
          pnpm test:node-server --artifact src/main/orcad/orcad-packaged-structured-chat.integration.test.ts --maxWorkers=2
      - name: Archive with modes, validate extraction and record hashes
        shell: bash
        run: |
          test -f out/orcad/.version
          test -f out/orcad/.server-target
          test -f out/orcad/.runtime-node
          test -f out/orcad/native-chat-visuals/.claude-plugin/plugin.json
          test -z "$(find out/orcad out/runtimes -type l -print -quit)"
          mkdir -m 0755 observer-dev-artifact
          printf 'source_commit=%s\nsource_tree=%s\nworkflow_commit=%s\nrun_id=%s\nrun_attempt=%s\nrunner=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_OS-$RUNNER_ARCH" \
            > observer-dev-artifact/provenance.txt
          (cd out && find orcad runtimes -type f -print0 | sort -z | xargs -0 sha256sum) > observer-dev-artifact/files.sha256
          (cd out && find orcad runtimes -printf '%m %y %p\n' | sort) > observer-dev-artifact/types-modes.txt
          tar -C out -czf observer-dev-artifact/orcad-linux-x64-glibc-88c5e868.tar.gz orcad runtimes
          sha256sum observer-dev-artifact/orcad-linux-x64-glibc-88c5e868.tar.gz > observer-dev-artifact/archive.sha256
          mkdir -m 0755 "$RUNNER_TEMP/observer-extract"
          tar -C "$RUNNER_TEMP/observer-extract" -xzf observer-dev-artifact/orcad-linux-x64-glibc-88c5e868.tar.gz
          (cd "$RUNNER_TEMP/observer-extract" && sha256sum -c "$GITHUB_WORKSPACE/observer-dev-artifact/files.sha256" --status)
          (cd "$RUNNER_TEMP/observer-extract" && find orcad runtimes -printf '%m %y %p\n' | sort) > "$RUNNER_TEMP/extracted-types-modes.txt"
          cmp observer-dev-artifact/types-modes.txt "$RUNNER_TEMP/extracted-types-modes.txt"
          test -f "$RUNNER_TEMP/observer-extract/orcad/.version"
          test -f "$RUNNER_TEMP/observer-extract/orcad/.server-target"
          test -f "$RUNNER_TEMP/observer-extract/orcad/.runtime-node"
          test "$(find "$RUNNER_TEMP/observer-extract/runtimes" -path '*/bin/node' -type f -perm /111 | wc -l)" = 1
          printf 'ARCHIVE_EXTRACT_HASH_MODE_OK\n'
      - name: Upload DEV-only candidate
        uses: actions/upload-artifact@v7
        with:
          name: observer-dev-linux-x64-tar-88c5e868
          path: observer-dev-artifact/
          if-no-files-found: error
          retention-days: 2
          compression-level: 0
