name: Observer source verification
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/observer-source-verify.yml
      - config/scripts/observer-credential-*.ts
      - config/tsconfig.node.json
      - src/main/runtime/observer-credential-store*.ts
      - src/main/runtime/runtime-observer-current-catalog.test.ts
      - src/main/runtime/runtime-rpc-observer-auth.test.ts
      - src/main/runtime/rpc/rpc-caller-scope*.ts
      - src/main/runtime/rpc/methods/runtime-observer.ts
      - src/main/runtime/workspaces/workspace-catalog.ts
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Record tested source identity
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
          printf 'sourceSha=%s\nsourceTree=%s\nworkflowSha=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" "${{ github.workflow_sha }}"
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: none
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: config/.bun-version
      - name: Check affected server and owner-local admin source
        run: pnpm run typecheck:ci --project=config/tsconfig.node.json --bun-concurrency=1 --bun-threads=2
      - name: Exercise observer scope, catalog, expiry and path guards
        run: |
          pnpm exec vitest run \
            config/scripts/observer-credential-path.test.ts \
            src/main/runtime/observer-credential-store.test.ts \
            src/main/runtime/runtime-observer-current-catalog.test.ts \
            src/main/runtime/runtime-rpc-observer-auth.test.ts \
            src/main/runtime/rpc/rpc-caller-scope.test.ts
